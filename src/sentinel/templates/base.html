<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GitHub Sentinel{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">GitHub<span>Sentinel</span></a>
    <nav>
      <a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">总览</a>
      <a href="/subscriptions" class="{% if active_page == 'subscriptions' %}active{% endif %}">订阅</a>
      <a href="/docs">API 文档</a>
    </nav>
    <div class="chips">
      <span class="chip">{{ settings.github_mode }}</span>
      <span class="chip">{{ settings.llm_provider }}</span>
      <span class="chip">{{ settings.notify_channel }}</span>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    GitHub Sentinel {{ settings.version }} · 时区 {{ settings.timezone }} · 数据目录 {{ settings.data_dir }}
  </footer>
</body>
</html>
